<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- 'unsafe-inline' for styles only: series colors are set via style attributes.
       OpenStreetMap tile hosts are allowed for the aircraft map. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https://tile.openstreetmap.org https://*.tile.openstreetmap.org" />
  <title>rtl_433 GUI</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-palette="#3987e5,#d95926,#199e70">
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9" />
          <path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5" />
          <circle cx="12" cy="12" r="2" />
          <path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5" />
          <path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1" />
        </svg>
        <div class="brand-text">
          <span class="brand-name">rtl_433</span>
          <span class="brand-sub">Signal Console</span>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="events">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
          <span>Events</span>
          <span class="nav-badge" id="nav-badge-events" hidden>0</span>
        </button>
        <button class="nav-item" data-view="charts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M7 14l4-4 3 3 5-6"/></svg>
          <span>Charts</span>
        </button>
        <button class="nav-item" data-view="aircraft">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
          <span>Aircraft</span>
          <span class="nav-badge" id="nav-badge-aircraft" hidden>0</span>
        </button>
        <button class="nav-item" data-view="pagers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 12h.01M11 12h.01M15 12h.01"/><path d="M7 15.2h10"/></svg>
          <span>Pagers</span>
          <span class="nav-badge" id="nav-badge-pagers" hidden>0</span>
        </button>
        <button class="nav-item" data-view="sonde">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5.2"/><path d="M9.8 12.6 9 17h6l-.8-4.4"/><path d="M9 17c0 2 1.3 4 3 4s3-2 3-4"/></svg>
          <span>Radiosonde</span>
          <span class="nav-badge" id="nav-badge-sonde" hidden></span>
        </button>
        <button class="nav-item" data-view="console">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5"/><path d="M13 17h6"/></svg>
          <span>Console</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <label class="demo-toggle" title="Replay simulated sensor traffic — no SDR needed">
          <input type="checkbox" id="demo-toggle" />
          <span class="switch"></span>
          <span>Demo mode</span>
        </label>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <h1 class="view-title" id="view-title">Dashboard</h1>
        <div class="topbar-spacer"></div>
        <select id="mode-select" class="mode-select" title="Which receiver the Start/Stop button controls — with several dongles, multiple modes can run at once">
          <option value="ism">ISM sensors</option>
          <option value="adsb">ADS-B aircraft</option>
          <option value="pocsag">POCSAG pagers</option>
          <option value="sonde">Radiosonde</option>
        </select>
        <div class="freq-chip" id="freq-chip" title="Tuned frequency">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l2-7 4 14 3-10 2 3h6"/></svg>
          <span id="freq-chip-text">433.92 MHz</span>
        </div>
        <div class="status-pill stopped" id="status-pill">
          <span class="status-dot"></span>
          <span id="status-text">Stopped</span>
        </div>
        <button class="btn btn-primary" id="btn-startstop">
          <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg id="icon-stop" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6.5" y="6.5" width="11" height="11" rx="1.5"/></svg>
          <span id="btn-startstop-text">Start</span>
        </button>
      </header>

      <main class="view-root" id="view-root">
        <section class="view" id="view-dashboard"></section>
        <section class="view" id="view-events" hidden></section>
        <section class="view" id="view-charts" hidden></section>
        <section class="view view-flush" id="view-aircraft" hidden></section>
        <section class="view" id="view-pagers" hidden></section>
        <section class="view view-flush" id="view-sonde" hidden></section>
        <section class="view" id="view-console" hidden></section>
        <section class="view" id="view-settings" hidden></section>
      </main>
    </div>
  </div>

  <div class="toast-host" id="toast-host"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
